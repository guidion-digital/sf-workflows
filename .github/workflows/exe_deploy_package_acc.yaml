name: Deploy package to acc environment

on:
    workflow_call:

jobs:
    deploy:
        permissions:
            contents: write
        uses: guidion-digital/sf-workflows/.github/workflows/deploy_package_acc.yaml@v1
        with:
            environment_name: acc
            SF_DEVHUB_ALIAS: ${{ vars.SF_DEVHUB_ALIAS_PROD }}
            SF_DEVHUB_SCRATCH_ALIAS: ${{ vars.SF_DEVHUB_SCRATCH_ALIAS_PROD }}
            SF_DEVHUB_USERNAME: ${{ vars.SF_DEVHUB_USERNAME_PROD }}
            SF_LOGIN_URL: ${{ vars.SF_LOGIN_URL_ACC }}
            SF_USERNAME: ${{ vars.SF_USERNAME_ACC }}
            SF_CLIENT_ID: ${{ vars.SF_CLIENT_ID_ACC }}
            SF_DEVHUB_CLIENT_ID: ${{ vars.SF_DEVHUB_CLIENT_ID }}
        secrets:
            SF_CLIENT_KEY: ${{ secrets.SF_CLIENT_KEY_ACC }}
            SF_DEVHUB_CLIENT_KEY: ${{ secrets.SF_DEVHUB_CLIENT_KEY }}
            NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
            SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
